name: Build and release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "gfn") | .version')
          test "$RELEASE_TAG" = "v$version" || { echo "Tag must match Cargo.toml version v$version"; exit 1; }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release
        shell: bash
        run: |
          # Cargo.toml 已启用体积优化、完整 LTO、单代码生成单元、
          # panic 直接终止及符号剥离；此处仅配置各平台链接器。
          case "${{ runner.os }}" in
            Linux)
              export RUSTFLAGS="-C linker=musl-gcc -C target-feature=+crt-static -C link-arg=-Wl,--gc-sections"
              ;;
            macOS)
              export RUSTFLAGS="-C link-arg=-Wl,-dead_strip"
              ;;
            Windows)
              export RUSTFLAGS="-C link-arg=/OPT:REF -C link-arg=/OPT:ICF"
              ;;
          esac
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test standalone binary
        shell: bash
        env:
          FEISHU_DISABLE: 'false'
        run: |
          binary="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/gfn"
          if [[ "${{ runner.os }}" == Windows ]]; then binary="${binary}.exe"; fi
          cd "$RUNNER_TEMP"
          "$binary" success --dry-run --commits=0
          FEISHU_DISABLE=true "$binary" failure
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/gfn gfn
          tar -cf - gfn LICENSE | gzip -9 > dist/gfn-${{ matrix.target }}.tar.gz
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          Path("dist").mkdir(exist_ok=True)
          binary = Path("target/${{ matrix.target }}/release/gfn.exe")
          with ZipFile("dist/gfn-${{ matrix.target }}.zip", "w",
                       compression=ZIP_DEFLATED, compresslevel=9) as archive:
              archive.write(binary, "gfn.exe")
              archive.write("LICENSE", "LICENSE")
      - name: Report binary and package sizes
        shell: python
        run: |
          import os
          from pathlib import Path

          suffix = ".exe" if os.name == "nt" else ""
          binary = Path("target/${{ matrix.target }}/release/gfn" + suffix)
          files = [binary, *sorted(Path("dist").iterdir())]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## ${{ matrix.target }}\n\n| File | Bytes | MiB |\n| --- | ---: | ---: |\n")
              for path in files:
                  size = path.stat().st_size
                  summary.write(f"| {path.name} | {size:,} | {size / 1024**2:.2f} |\n")
      - uses: actions/upload-artifact@v4
        with:
          name: gfn-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          # 压缩包已完成压缩，避免上传制品时重复压缩。
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
