[package]
name = "gfn"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Feishu webhook notifications for GitLab CI"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
hmac = "0.12"
minijinja = { version = "2", default-features = false, features = ["builtins", "json", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
